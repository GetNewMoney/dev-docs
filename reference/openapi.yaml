openapi: 3.1.0
info:
  title: New Money DNZD DEV API
  version: 0.3.0-dev
  description: |
    The DEV integration requires two calls. Flow 1 creates a DNZD mint request.
    Flow 2 simulates the matching Akahu payment using the exact reference and
    amount returned by Flow 1. Reconciliation and minting then run asynchronously.
    Do not send real money in DEV.
  contact:
    email: tech@getnew.money
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://devv2-dnzd.newmoney-api.workers.dev
    description: DEV v2
paths:
  /:
    post:
      tags:
        - Flow 1
      security: []
      operationId: createMintRequest
      summary: Create a mint request (Flow 1)
      description: |
        Records a pending request and returns the unique payment reference and
        exact amount required by Flow 2. The issued DEV API key is supplied in
        the JSON body and must remain server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMintRequest"
            examples:
              baseSepolia:
                value:
                  apiKey: replace-with-issued-dev-key
                  amount: 10
                  chain: base_sepolia
      responses:
        "201":
          description: Mint request created and awaiting the Flow 2 payment event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMintRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhook/dev-payment-simulator:
    post:
      tags:
        - Flow 2
      servers:
        - url: https://toroagroup.app.n8n.cloud
          description: DEV payment simulator
      security: []
      operationId: simulatePayment
      summary: Simulate the matching payment (Flow 2)
      description: |
        Creates the simulated Akahu credit used by reconciliation. Submit the
        exact payment reference and amount returned by Flow 1. A successful
        response confirms payment-event creation, not synchronous mint completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatePaymentRequest"
            examples:
              matchingPayment:
                value:
                  payment_reference: MABC123XYZ
                  amount: 10
      responses:
        "200":
          description: Simulated payment event created and reconciliation triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatePaymentResponse"
        "400":
          description: Invalid simulator request or amount mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingReference:
                  value:
                    ok: false
                    error: payment_reference is required
                invalidAmount:
                  value:
                    ok: false
                    error: amount must be a finite number
                amountMismatch:
                  value:
                    ok: false
                    error: Payment amount does not match mint request amount
                    expected_amount: 5
                    received_amount: 6
        "404":
          description: No mint request found for the payment reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                ok: false
                error: No mint request found for that payment_reference
        "409":
          description: Mint request is no longer awaiting payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                ok: false
                error: Mint request is not awaiting payment
                request_status: minted
components:
  schemas:
    CreateMintRequest:
      type: object
      additionalProperties: false
      required:
        - apiKey
        - amount
      properties:
        apiKey:
          type: string
          minLength: 10
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
          description: Issued DEV API key. Keep it server-side.
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          description: Exact NZD amount to deposit and mint.
        chain:
          type: string
          default: base_sepolia
          enum:
            - base_sepolia
    CreateMintRequestResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - status
        - orderId
        - amount
        - currency
        - chain
        - brale_address_id
        - payment
        - message
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: pending_payment
        orderId:
          type: string
        amount:
          type: number
        currency:
          type: string
          const: NZD
        chain:
          type: string
          const: base_sepolia
        brale_address_id:
          type: string
          description: Registered DEV destination identifier.
        payment:
          $ref: "#/components/schemas/PaymentInstructions"
        message:
          type: string
    PaymentInstructions:
      type: object
      additionalProperties: false
      required:
        - bank_name
        - account_name
        - account_number
        - reference
        - expires_at
      properties:
        bank_name:
          type: string
        account_name:
          type: string
        account_number:
          type: string
          description: DEV receiving account metadata. Do not send real money in DEV.
        reference:
          type: string
          maxLength: 12
        expires_at:
          type: string
          format: date-time
    SimulatePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - payment_reference
        - amount
      properties:
        payment_reference:
          type: string
          minLength: 1
          maxLength: 12
          description: Exact payment.reference returned by Flow 1.
        amount:
          type: number
          exclusiveMinimum: 0
          description: Exact numeric amount returned by Flow 1.
        other_account:
          type: string
          default: 00-0000-0000000-00
          description: Optional simulated payer account.
        description:
          type: string
          default: DEV SIMULATED PAYMENT
          description: Optional simulator transaction description.
    SimulatePaymentResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - message
        - payment_event
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string
          const: Simulated payment event created
        payment_event:
          $ref: "#/components/schemas/PaymentEvent"
    PaymentEvent:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - transaction_hash
        - source_type
        - order_id
        - payment_reference
        - amount
        - currency
        - receiving_account
        - other_account
        - transaction_date
        - status
        - description
        - user_name
        - user_email
        - brale_address_id
        - chain
      properties:
        transaction_id:
          type: string
        transaction_hash:
          type: string
        source_type:
          type: string
          const: dev_simulator
        order_id:
          type: string
        payment_reference:
          type: string
        amount:
          type: number
        currency:
          type: string
          const: NZD
        receiving_account:
          type: string
        other_account:
          type: string
        transaction_date:
          type: string
          format: date-time
        status:
          type: string
          const: settled
        description:
          type: string
        user_name:
          type: string
        user_email:
          type:
            - string
            - "null"
        brale_address_id:
          type: string
        chain:
          type: string
          const: base_sepolia
    Error:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        expected_amount:
          type: number
        received_amount:
          type: number
        request_status:
          type: string
        allowed:
          type: array
          items:
            type: string
        limit:
          type: integer
        retryAfter:
          type: integer
        message:
          type: string
        requestId:
          type: string
          format: uuid
        ip:
          type: string
      required:
        - error
  responses:
    BadRequest:
      description: Invalid request or assigned limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidRequest:
              value:
                error: Invalid request
            invalidKeyFormat:
              value:
                ok: false
                error: Invalid API key format
            amountPrecision:
              value:
                ok: false
                error: NZD amounts limited to 2 decimal places (e.g., 10.99)
    Unauthorized:
      description: Invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            ok: false
            error: Invalid API key
    Forbidden:
      description: Partner account inactive or not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            inactiveAccount:
              value:
                ok: false
                error: User account is not active
            originNotAllowed:
              value:
                error: Origin not allowed
            accessDenied:
              value:
                error: Access denied
                ip: 203.0.113.10
    MethodNotAllowed:
      description: HTTP method is not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Method not allowed
            allowed:
              - POST
              - OPTIONS
    RateLimited:
      description: Rate limit or overlapping request
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rateLimit:
              value:
                error: Rate limit exceeded
                limit: 10
                retryAfter: 60
            overlappingRequest:
              value:
                error: Request already in progress
    ServerError:
      description: Internal processing error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internalError:
              value:
                error: Internal server error
                message: Failed to process request
                requestId: 8d8075de-ec3a-4b4f-8d32-4866acfd36c7
            invalidUpstream:
              value:
                ok: false
                error: Invalid upstream response
    ServiceUnavailable:
      description: Service configuration unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Service unavailable
