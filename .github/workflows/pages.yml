name: Publish developer portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Prepare documentation source
        run: node scripts/prepare-site.mjs
      - name: Build documentation
        run: mkdocs build --site-dir "${{ runner.temp }}/site"
      - name: Build API reference
        run: node scripts/build-reference.mjs "${{ runner.temp }}/site"
      - name: Disable Jekyll processing
        run: touch "${{ runner.temp }}/site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "${{ runner.temp }}/site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
