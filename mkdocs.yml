site_name: New Money Developer
site_description: Integrate with the New Money DNZD development API.
site_url: https://getnewmoney.github.io/dev-docs/
docs_dir: .site-source
site_dir: .site
strict: true

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: teal
      accent: orange
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: README.md
  - Documentation:
      - Overview: docs/README.md
      - Getting started: docs/getting-started.md
      - Authentication: docs/authentication.md
      - Mint requests: docs/concepts/mint-requests.md
      - Payment lifecycle: docs/concepts/payment-lifecycle.md
      - Testing: docs/testing.md
      - Errors: docs/resources/errors.md
      - Support: docs/resources/support.md
  - API Reference: reference/README.md
  - Examples:
      - Overview: examples/README.md
      - cURL: examples/curl.md
      - JavaScript: examples/javascript.md
      - Python: examples/python.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GetNewMoney

copyright: Copyright &copy; 2026 New Money
